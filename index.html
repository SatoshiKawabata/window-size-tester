<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <script>
    /**
     * クエリパラメータ `viewport` から表示モードを取得する。
     * @returns {'device'|'375'} 既定は 'device'
     */
    function getViewportMode() {
      var v = new URLSearchParams(location.search).get('viewport');
      return v === '375' ? '375' : 'device';
    }

    /**
     * モードに対応する meta viewport の content を返す。
     * @param {'device'|'375'} mode
     * @returns {string}
     */
    function viewportContent(mode) {
      return mode === '375' ? 'width=375' : 'width=device-width, initial-scale=1';
    }

    /**
     * meta viewport を設定する。無ければ作成し、あれば content を書き換える。
     * @param {'device'|'375'} mode
     */
    function applyViewportMeta(mode) {
      var meta = document.querySelector('meta[name="viewport"]');
      if (!meta) {
        meta = document.createElement('meta');
        meta.name = 'viewport';
        document.head.appendChild(meta);
      }
      meta.content = viewportContent(mode);
    }

    window.VIEWPORT_MODE = getViewportMode();
    applyViewportMeta(window.VIEWPORT_MODE);
  </script>
  <title>Window Size Tester</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; font-size: 14px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    h2 { font-size: 15px; margin: 16px 0 4px; }
    fieldset { margin: 0 0 8px; padding: 6px 10px; }
    label { margin-right: 12px; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    th, td { border: 1px solid #ccc; padding: 3px 6px; text-align: left; word-break: break-all; }
    th { width: 45%; font-weight: normal; color: #555; }
    td { font-family: ui-monospace, monospace; }
    .meta { color: #555; font-size: 12px; }
    #log { max-height: 40vh; overflow: auto; border: 1px solid #ccc; }
    #log table { width: max-content; min-width: 100%; table-layout: auto; font-family: ui-monospace, monospace; font-size: 11px; }
    #log th, #log td { width: auto; white-space: nowrap; word-break: normal; padding: 2px 6px; }
    #log thead th { position: sticky; top: 0; background: #eee; color: #333; }
    button { font-size: 12px; margin-left: 8px; }
    #qr { margin: 8px 0; }
    #qr svg { width: 100%; max-width: 360px; height: auto; display: block; background: #fff; }
  </style>
</head>
<body>
  <h1>Window Size Tester</h1>

  <fieldset>
    <legend>meta viewport（変更は即時反映し、URL に保持）</legend>
    <label><input type="radio" name="viewport" value="device"> width=device-width</label>
    <label><input type="radio" name="viewport" value="375"> width=375</label>
    <div class="meta">適用中: <code id="viewport-content"></code></div>
  </fieldset>

  <div class="meta">最終更新: <span id="updated"></span> / イベント: <span id="event"></span></div>

  <h2>QR コード <button type="button" id="show-qr">最新ログで生成</button> <button type="button" id="hide-qr">閉じる</button></h2>
  <div class="meta">先頭行がキー名、以降が新しい順のイベント。収まる件数だけ入る。</div>
  <div id="qr"></div>

  <h2>イベントログ（最新が上） <button type="button" id="clear-log">クリア</button></h2>
  <div id="log"><table><thead></thead><tbody></tbody></table></div>

  <div id="tables"></div>

  <h2>navigator.userAgent</h2>
  <div class="meta" id="ua"></div>

  <script>
    /**
     * 計測値を収集する。
     * @returns {Array<{title: string, rows: Array<[string, *]>}>}
     */
    function collectMetrics() {
      var de = document.documentElement;
      var vv = window.visualViewport;
      var so = screen.orientation;
      /** @param {string} q */
      var mm = function (q) { return matchMedia(q).matches; };
      return [
        { title: 'window', rows: [
          ['innerWidth', innerWidth], ['outerWidth', outerWidth],
          ['devicePixelRatio', devicePixelRatio],
          ['scrollX', scrollX], ['scrollY', scrollY]
        ]},
        { title: 'document.documentElement', rows: [
          ['clientWidth', de.clientWidth]
        ]},
        { title: 'screen', rows: [
          ['width', screen.width], ['availWidth', screen.availWidth],
          ['orientation.type', so ? so.type : 'n/a'],
          ['orientation.angle', so ? so.angle : 'n/a']
        ]},
        { title: 'visualViewport', rows: vv ? [
          ['width', vv.width], ['scale', vv.scale],
          ['offsetLeft', vv.offsetLeft], ['offsetTop', vv.offsetTop],
          ['pageLeft', vv.pageLeft], ['pageTop', vv.pageTop]
        ] : [['(unsupported)', '']]},
        { title: 'matchMedia', rows: [
          ['(orientation: portrait)', mm('(orientation: portrait)')],
          ['(hover: hover)', mm('(hover: hover)')],
          ['(pointer: coarse)', mm('(pointer: coarse)')],
          ['(min-width: 375px)', mm('(min-width: 375px)')],
          ['(max-width: 375px)', mm('(max-width: 375px)')],
          ['(min-width: 750px)', mm('(min-width: 750px)')],
          ['(max-width: 750px)', mm('(max-width: 750px)')]
        ]}
      ];
    }

    /**
     * 計測値をテーブルとして描画する。
     * @param {string} eventName 更新のきっかけとなったイベント名
     */
    function render(eventName) {
      var metrics = collectMetrics();
      appendLog(eventName, metrics);
      var html = metrics.map(function (sec) {
        return '<h2>' + sec.title + '</h2><table>' + sec.rows.map(function (r) {
          return '<tr><th>' + r[0] + '</th><td>' + String(r[1]) + '</td></tr>';
        }).join('') + '</table>';
      }).join('');
      document.getElementById('tables').innerHTML = html;
      document.getElementById('updated').textContent = new Date().toLocaleTimeString();
      document.getElementById('event').textContent = eventName;
    }

    /** ログの最大保持件数 */
    var LOG_LIMIT = 300;

    /** QR に入れる最大文字数（画面上で読み取れる密度に抑える） */
    var QR_MAX_CHARS = 1000;

    /** QR 用の簡潔なログ（新しい順） */
    var compactLogs = [];

    /** QR 用ログのキー名 */
    var COMPACT_KEYS = 't ev iw ow dpr cw sw saw ori vvw vvs';

    /**
     * 小数を2桁に丸める。
     * @param {number} n
     * @returns {number}
     */
    function r2(n) { return Math.round(n * 100) / 100; }

    /**
     * 現在値を QR 用の1行に整形する。
     * @param {string} eventName
     * @returns {string}
     */
    function compactLine(eventName) {
      var de = document.documentElement;
      var vv = window.visualViewport;
      var so = screen.orientation;
      return [
        new Date().toLocaleTimeString('ja-JP', { hour12: false }), eventName.replace('visualViewport.', 'vv.'),
        innerWidth, outerWidth, devicePixelRatio,
        de.clientWidth, screen.width, screen.availWidth,
        so ? so.type.replace('-primary', '').replace('-secondary', '2') + so.angle : '-',
        vv ? r2(vv.width) : '-', vv ? r2(vv.scale) : '-'
      ].join(' ');
    }

    /**
     * QR に入れるテキストを組み立てる（上限文字数まで新しい順に詰める）。
     * @returns {string}
     */
    function buildQrText() {
      var text = 'viewport=' + window.VIEWPORT_MODE + '\n' + navigator.userAgent + '\n' + COMPACT_KEYS;
      for (var i = 0; i < compactLogs.length; i++) {
        if (text.length + compactLogs[i].length + 1 > QR_MAX_CHARS) break;
        text += '\n' + compactLogs[i];
      }
      return text;
    }

    /**
     * QR コードを生成して表示する。
     */
    function showQr() {
      var el = document.getElementById('qr');
      if (typeof qrcode !== 'function') {
        el.textContent = 'QR ライブラリを読み込めませんでした（通信を確認）';
        return;
      }
      var qr = qrcode(0, 'L');
      qr.addData(buildQrText());
      qr.make();
      el.innerHTML = qr.createSvgTag(4, 8);
    }

    /** ログ表の列名に付ける接頭辞（セクション名ごと） */
    var LOG_PREFIX = { 'window': '', 'document.documentElement': 'de.', 'screen': 'screen.', 'visualViewport': 'vv.', 'matchMedia': '' };

    /**
     * 計測値をログ表の先頭行として追記する。
     * @param {string} eventName
     * @param {Array<{title: string, rows: Array<[string, *]>}>} metrics
     */
    function appendLog(eventName, metrics) {
      compactLogs.unshift(compactLine(eventName));
      if (compactLogs.length > LOG_LIMIT) compactLogs.pop();
      var cols = [['time', new Date().toLocaleTimeString('ja-JP', { hour12: false })], ['event', eventName]];
      metrics.forEach(function (sec) {
        var prefix = LOG_PREFIX[sec.title] || '';
        sec.rows.forEach(function (r) { cols.push([prefix + r[0], r[1]]); });
      });
      var thead = document.querySelector('#log thead');
      if (!thead.firstChild) {
        var htr = document.createElement('tr');
        cols.forEach(function (c) { var th = document.createElement('th'); th.textContent = c[0]; htr.appendChild(th); });
        thead.appendChild(htr);
      }
      var tr = document.createElement('tr');
      cols.forEach(function (c) { var td = document.createElement('td'); td.textContent = String(c[1]); tr.appendChild(td); });
      var tbody = document.querySelector('#log tbody');
      tbody.insertBefore(tr, tbody.firstChild);
      while (tbody.childElementCount > LOG_LIMIT) tbody.removeChild(tbody.lastChild);
    }

    /**
     * viewport 切り替え UI を初期化する（切り替え時はリロードしない）。
     */
    function initViewportSwitch() {
      var mode = window.VIEWPORT_MODE;
      document.getElementById('viewport-content').textContent = viewportContent(mode);
      document.querySelectorAll('input[name="viewport"]').forEach(function (el) {
        el.checked = el.value === mode;
        el.addEventListener('change', function () {
          // リロードせず URL・meta・表示を更新する
          var url = new URL(location.href);
          url.searchParams.set('viewport', el.value);
          history.replaceState(null, '', url.toString());
          window.VIEWPORT_MODE = el.value;
          applyViewportMeta(el.value);
          document.getElementById('viewport-content').textContent = viewportContent(el.value);
          render('viewport:' + el.value);
        });
      });
    }

    initViewportSwitch();
    document.getElementById('clear-log').addEventListener('click', function () {
      document.querySelector('#log tbody').innerHTML = '';
      compactLogs = [];
    });
    document.getElementById('show-qr').addEventListener('click', showQr);
    document.getElementById('hide-qr').addEventListener('click', function () {
      document.getElementById('qr').innerHTML = '';
    });
    document.getElementById('ua').textContent = navigator.userAgent;
    render('init');
    ['resize', 'orientationchange', 'load'].forEach(function (ev) {
      addEventListener(ev, function () { render(ev); });
    });
    if (window.visualViewport) {
      ['resize'].forEach(function (ev) {
        visualViewport.addEventListener(ev, function () { render('visualViewport.' + ev); });
      });
    }
  </script>
</body>
</html>
